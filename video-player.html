<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Player</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <style>
        :root {
            color-scheme: dark;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
            background: #05070a;
            color: #e6ebee;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            display: grid;
            place-items: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        main {
            width: min(96vw, 1200px);
        }

        h1 {
            margin: 0 0 1rem;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        video {
            width: 100%;
            max-height: 82vh;
            border: 1px solid rgba(230, 235, 238, 0.2);
            background: #000;
            display: block;
        }

        .error {
            margin-top: 1rem;
            color: #ff9b9b;
            display: none;
            font-size: 0.95rem;
        }
    </style>
</head>

<body>
    <main>
        <h1 id="title">Project Video</h1>
        <video id="player" controls autoplay playsinline preload="metadata"></video>
        <p class="error" id="error">This browser could not play the video format. If needed, convert to MP4 (H.264).</p>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const src = params.get('src');
        const title = params.get('title');

        const titleEl = document.getElementById('title');
        const player = document.getElementById('player');
        const errorEl = document.getElementById('error');

        if (title) {
            titleEl.textContent = decodeURIComponent(title);
            document.title = decodeURIComponent(title) + ' - Video';
        }

        if (!src) {
            errorEl.textContent = 'No video source provided.';
            errorEl.style.display = 'block';
        } else {
            player.src = decodeURIComponent(src);
            player.addEventListener('error', () => {
                errorEl.style.display = 'block';
            });
        }
    </script>
</body>

</html>
